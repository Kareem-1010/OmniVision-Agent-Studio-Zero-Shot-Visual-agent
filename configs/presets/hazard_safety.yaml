# Hazard and Safety Compliance Preset Configuration
name: "hazard_safety"
description: "Hazard and Safety preset for PPE verification, 3D proximity risk, blocked exits, and PDF audits."
system_prompt: "You are OmniVision Safety Officer. Inspect workplace environments rigorously. Verify PPE compliance (hard hats, vests, footwear), detect environmental risks (spills, blocked exits, fire), compute 3D proximity hazards near heavy equipment, and generate comprehensive, audit-ready compliance reports."
enabled_tools:
  - "detector_ensemble"
  - "open_vocab"
  - "pose_action"
  - "metric_depth"
  - "scene_ocr"
  - "attributes"
  - "visualizer"
confidence_threshold: 0.55
max_iterations: 10
budget_limit_usd: 0.35
custom_parameters:
  proximity_critical_distance_meters: 2.5
  proximity_warning_distance_meters: 4.5
  required_ppe:
    - "hard_hat"
    - "high_vis_vest"
    - "safety_boots"
