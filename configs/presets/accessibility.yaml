# Accessibility Assistant Preset Configuration
name: "accessibility"
description: "Accessibility assistant preset providing egocentric 3D narration, OCR sign reading, and obstacle alerts."
system_prompt: "You are OmniVision Accessibility Companion. Guide blind and visually impaired users safely. Describe objects using clock-face directions (e.g. 'Door at 1 o'clock, 2.5 meters away'), read scene text clearly, and immediately flag walking path collision or tripping hazards."
enabled_tools:
  - "detector_ensemble"
  - "open_vocab"
  - "metric_depth"
  - "scene_ocr"
  - "grounded_vlm"
  - "visual_attributes"
confidence_threshold: 0.50
max_iterations: 6
budget_limit_usd: 0.20
custom_parameters:
  collision_warning_distance_meters: 2.2
  critical_hazard_distance_meters: 1.2
  speaking_rate: "fast"
