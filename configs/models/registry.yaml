memory:
  max_vram_fraction: 0.85
  lru_cache_size: 4
  auto_offload_to_cpu: true
  enable_fp16: true
  enable_torch_compile: false
  cache_dir: ".cache/models"

detectors:
  yolo11:
    model_id: "yolo11x.pt"
    precision: "fp16"
    device: "auto"
  rtdetr:
    model_id: "rtdetr-l"
    precision: "fp16"
    device: "auto"

segmentation:
  sam2:
    model_id: "sam2_hiera_large"
    precision: "fp16"
    device: "auto"

vlm:
  qwen_vl:
    model_id: "Qwen/Qwen2.5-VL-7B-Instruct"
    precision: "int8"
    device: "auto"
