defaults:
  - _self_
  - llm: default
  - models: registry
  - agent: base

system:
  project_name: "OmniVision-Agent-v3"
  seed: 42
  device: "auto"  # auto, cuda, mps, cpu
  cache_dir: ".cache/omnivision"
  enable_redis: false
  redis_url: "redis://localhost:6379/0"
  log_level: "INFO"

telemetry:
  track_costs: true
  track_latencies: true
  export_traces: false
