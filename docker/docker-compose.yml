services:
  omnivision-agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: omnivision-agent
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - OMNIVISION_DEVICE=cuda
      - REDIS_URL=redis://redis:6379/0
      - ENABLE_REDIS_CACHE=true
    volumes:
      - ..:/app
      - omnivision-cache:/app/.cache
    ports:
      - "8000:8000"
      - "7860:7860"
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: omnivision-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  omnivision-cache:
  redis-data:
